# Site Configuration

# Theme, mapped to the directory: ./theme/xxxx
theme: default

# HTML Language setting
lang: "de"

# Plugins, implemented in ./plugins/PLUGIN_NAME
# Use {{ vars.PLUGIN_NAME }} in the settings below

# The output of the plugin can be used below, e.g., {{vars.MediumFollowersCountPlugin}}
plugins:
  # Automatically fetch Medium follower count
  # - MediumFollowersCountPlugin:
  #    username: zhgchgli
  # Automatically fetch Github repo star count
  - GithubRepoStarsCountPlugin:
      - juekr/awesome-podcasting-german
      - juekr/remote-friendship-lamp

# Google Analytics tracking id
google_analytics_id:

# HTML Title
title: "Jürgen Krauß – #Painfluencer, Writer, Podcaster"

# Avatar image path
avatar: "https://brandad.de/templates/yootheme/cache/ea/juergenkrauss_2400_1350px-ea3c4e0b.webp" 
# "./images/profile.jpeg"

# Name section text
name: "Es ist ein Krauß!"

# Tagline section text
tagline: >-
   Hi. Ich bin Jürgen. Das muss dir nicht leid tun, ich habe mich schon dran gewöhnt. 
   Ich kann ganz gut mit Worten umgehen. Und mit Podcasts. Aber nicht so gut mit chronischen Schmerzen.

